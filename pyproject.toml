[project]
name = "stc_s1mini_model"
description = "One HTTP service that serves the S1-mini speech-to-text normalizer through Ollama"
version = "0.1.0"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "python-dotenv==1.2.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "tokenizers>=0.22",
    "huggingface-hub>=0.34",
]

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27", "playwright>=1.40"]

[tool.uv]
package = false  # runs from src/, only the dependencies are installed

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true  # runs from src/, installs only the dependencies

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
