# S1-mini API replicas share host Ollama; each keeps its own queue and answer cache.
name: stc_s1mini_model

services:
  stc_s1mini_model:
    build: .
    image: stc_s1mini_model:latest
    restart: unless-stopped
    mem_limit: ${SERVICE_MEM_LIMIT:-0}  # 0 = no cap; a cap makes an out-of-memory kill stay inside this container
    environment:
      SERVICE_ADMIN_PASSWORD: ${SERVICE_ADMIN_PASSWORD:-}
      SERVICE_NUM_THREAD: ${SERVICE_NUM_THREAD:-}
      SERVICE_OLLAMA_PARALLEL: ${SERVICE_OLLAMA_PARALLEL:-2}  # same value as OLLAMA_NUM_PARALLEL on your Ollama
      SERVICE_REPLICAS: ${SERVICE_REPLICAS:-1}  # shown read-only on /admin/
      SERVICE_OLLAMA_URL: ${SERVICE_OLLAMA_URL-http://host.docker.internal:11434}
      SERVICE_OLLAMA_MODEL: ${SERVICE_OLLAMA_MODEL:-s1-mini:f16}
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - stc_s1mini_model_data:/data
    deploy:
      replicas: ${SERVICE_REPLICAS:-1}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:29280/health')"]
      interval: 15s
      timeout: 5s
      start_period: 300s
    networks: [stc_s1mini_model]

  stc_s1mini_model_lb:
    container_name: stc_s1mini_model_lb
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${SERVICE_PORT:-29280}:29280"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      stc_s1mini_model:
        condition: service_healthy
    networks:
      stc_s1mini_model:
      citadel:
        aliases: [stc_s1mini_model_lb]

volumes:
  stc_s1mini_model_data:
    name: stc_s1mini_model_data
networks:
  # Other stacks reach http://stc_s1mini_model_lb:29280 by joining this network.
  stc_s1mini_model:
    name: stc_s1mini_model
  citadel:
    name: citadel_core
    external: true
